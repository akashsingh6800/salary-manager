services:
  postgres:
    image: postgres:16 
    container_name: acme-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: acme_salary
      POSTGRES_USER: acme_user
      POSTGRES_PASSWORD: acme_password 
    ports: 
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
    container_name: acme-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://acme_user:acme_password@postgres:5432/acme_salary
    ports:
      - "8000:8000"
    depends_on:
      - postgres

  frontend:
    build: 
      context: ./frontend
    container_name: acme-frontend 
    restart: unless-stopped
    ports: 
      - "80:80"
    depends_on:
      - backend


volumes: 
  postgres_data: